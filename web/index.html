<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rainy</title>
    <meta name="description" content="Rainy — your self-hosted music library. 自托管的私人音乐库。" />
    <meta name="application-name" content="Rainy" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111113" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-64x64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Installed-app behaviour (iOS home screen + Android/desktop PWA). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rainy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <style>
      /* Page colour before the stylesheet loads (no white flash in dark mode / PWA launch).
         Keep in sync with STYLE_PREVIEWS in lib/theme.ts. */
      html { background-color: #f2f2f7; }
      html.dark { background-color: #111113; }
      html[data-style="anthropic"] { background-color: #faf9f5; }
      html.dark[data-style="anthropic"] { background-color: #141413; }
      html[data-style="openai"] { background-color: #ffffff; }
      html.dark[data-style="openai"] { background-color: #212121; }
      html[data-style="google-md"] { background-color: #f9f9ff; }
      html.dark[data-style="google-md"] { background-color: #10131a; }
    </style>
    <script>
      // Apply the saved theme, style + accent before first paint (no flash). Mirrors components/theme-provider.tsx.
      ;(function () {
        try {
          var root = document.documentElement
          var colors = {
            anthropic: ['#faf9f5', '#141413'],
            openai: ['#ffffff', '#212121'],
            apple: ['#f2f2f7', '#111113'],
            'google-md': ['#f9f9ff', '#10131a'],
          }
          var theme = localStorage.getItem('rainy.theme') || 'system'
          var style = localStorage.getItem('rainy.style')
          if (!Object.prototype.hasOwnProperty.call(colors, style)) style = 'apple'
          // Mirrors STYLE_ACCENTS / RETIRED_ACCENTS / resolveAccent in lib/theme-styles.ts.
          var accents = {
            anthropic: ['blue', 'green'],
            openai: ['blue', 'purple', 'orange'],
            apple: ['purple', 'pink', 'orange'],
            'google-md': ['green', 'purple', 'orange'],
          }
          var retired = { rain: 'blue', rose: 'pink', violet: 'purple', emerald: 'green', amber: 'orange', graphite: 'original' }
          var accent = localStorage.getItem('rainy.accent') || 'original'
          if (Object.prototype.hasOwnProperty.call(retired, accent)) accent = retired[accent]
          if (accents[style].indexOf(accent) < 0) accent = 'original'
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          root.setAttribute('data-style', style)
          root.setAttribute('data-accent', accent)
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) metas[i].content = colors[style][dark ? 1 : 0]
        } catch (e) {
          /* storage unavailable: defaults apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Rainy needs JavaScript to run. 请启用 JavaScript 以使用 Rainy。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
