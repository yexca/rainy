<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Rainy</title>
  <!-- Full-bleed source for maskable (Android adaptive) and Apple touch icons: no corner
       rounding (the platform masks it) and the glyph kept inside the central safe zone
       (circle of radius 40% = 25.6 units). -->
  <defs>
    <linearGradient id="rainy-bg" x1="6" y1="0" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cb4ff"/>
      <stop offset="1" stop-color="#2358d6"/>
    </linearGradient>
    <mask id="rainy-glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <g transform="translate(32 32.6) scale(0.8) translate(-32 -35.25)">
        <path fill="#fff" d="M32 9.5 45.01 30.07A15.5 15.5 0 1 1 18.99 30.07Z"/>
        <g fill="#000">
          <ellipse cx="28.4" cy="43.4" rx="4.9" ry="3.7" transform="rotate(-22 28.4 43.4)"/>
          <rect x="30.9" y="26" width="2.7" height="17.6" rx="1"/>
          <path d="M31.6 26c0 4 3.4 5 5.9 6.8 1.9 1.4 2.6 3.3 2.1 5.6-.4-2.4-2.5-4-5.3-4.6-1.1-.2-2 .1-2.7.6Z"/>
        </g>
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" fill="url(#rainy-bg)"/>
  <rect width="64" height="64" fill="#fff" mask="url(#rainy-glyph)"/>
</svg>
