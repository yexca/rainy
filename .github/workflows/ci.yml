name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      run_builds:
        description: Require Docker build validation for reusable calls.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      style: ${{ steps.plan.outputs.style }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      production: ${{ steps.plan.outputs.production }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
      - name: Run documentation and CI policy checks
        run: make ci-policy
      - name: Select required validation
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_RUN_BUILDS: ${{ inputs.run_builds || false }}
        run: make ci-plan

  style:
    name: Style
    needs: policy
    if: needs.policy.outputs.style == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
      - name: Enable pnpm
        run: corepack enable
      - name: Run frontend style checks
        run: make ci-style

  backend:
    name: Backend (${{ matrix.check }})
    needs: policy
    if: needs.policy.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [static, coverage, race]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install ffmpeg for media tests
        if: matrix.check != 'static'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Restore Go modules and tool dependencies
        id: modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-1.26.6-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}
          restore-keys: go-modules-${{ runner.os }}-${{ runner.arch }}-1.26.6-
      - name: Cache Go compilation and lint results
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-build-${{ runner.os }}-${{ runner.arch }}-1.26.6-${{ matrix.check }}-${{ hashFiles('**/*.go', 'internal/db/migrations/*.sql', 'go.mod', 'go.sum', 'scripts/golangci-lint.yml', 'Makefile') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-1.26.6-${{ matrix.check }}-
      - name: Run backend checks
        run: make ci-backend-${{ matrix.check }}
      - name: Save Go modules from one matrix job
        if: matrix.check == 'static' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Upload backend coverage
        if: always() && matrix.check == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend
    needs: policy
    if: needs.policy.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
      - name: Enable pnpm
        run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Run frontend checks
        run: make ci-frontend

  smoke:
    name: Smoke
    needs: policy
    if: needs.policy.outputs.production == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Cache production image layers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/rainy-buildx-cache
          key: docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', '.dockerignore', 'docker/**', 'VERSION', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', 'web/**') }}
          restore-keys: docker-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production image
        run: >-
          make DOCKER_IMAGE=rainy:ci DOCKER_BUILD="docker buildx build"
          DOCKER_BUILD_ARGS="--load --cache-from type=local,src=$RUNNER_TEMP/rainy-buildx-cache --cache-to type=local,dest=$RUNNER_TEMP/rainy-buildx-cache-next,mode=max"
          docker-build
      - name: Replace exported layer cache
        run: |
          rm -rf -- "$RUNNER_TEMP/rainy-buildx-cache"
          mv -- "$RUNNER_TEMP/rainy-buildx-cache-next" "$RUNNER_TEMP/rainy-buildx-cache"
      - name: Exercise the production image
        run: make DOCKER_IMAGE=rainy:ci smoke

  # Preserve the required check name; only the plan may authorize skipped jobs.
  core:
    name: Core
    if: always()
    needs: [policy, style, backend, frontend, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
      - name: Verify all required validation results
        env:
          CI_PLAN: ${{ needs.policy.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: make ci-results
