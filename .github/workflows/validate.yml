name: Validate

# The job definitions shared by the PR and Full validation tiers. pr.yml and
# full.yml call this file and choose the tier; it has no trigger of its own,
# so a tier is always an explicit decision of the caller.
on:
  workflow_call:
    inputs:
      tier:
        description: >-
          pr selects jobs from the changed paths; full runs every job.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Planning needs only Node and the diff, so every planned job starts without
  # waiting for Policy, which runs beside them.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      style: ${{ steps.plan.outputs.style }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      production: ${{ steps.plan.outputs.production }}
      go_audit: ${{ steps.plan.outputs.go_audit }}
      web_audit: ${{ steps.plan.outputs.web_audit }}
    steps:
      # Full history without file contents: the diff against the PR base reads
      # only commits and trees.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Select required validation
        id: plan
        env:
          CI_TIER: ${{ inputs.tier }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make ci-plan

  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      # actionlint is built from its pinned Go module.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Check documentation, workflows, and CI and release policy
        run: make ci-policy

  style:
    name: Style
    needs: plan
    if: needs.plan.outputs.style == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Run frontend style checks
        run: make ci-style

  backend:
    name: Backend (${{ matrix.check }})
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [static, coverage, race]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
      - name: Install ffmpeg for media tests
        if: matrix.check != 'static'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Restore Go modules and tool dependencies
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}
          restore-keys: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Cache Go compilation and lint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.check }}-${{ hashFiles('**/*.go', 'internal/db/migrations/*.sql', 'go.mod', 'go.sum', 'scripts/golangci-lint.yml', 'Makefile') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.check }}-
      - name: Run backend checks
        run: make ci-backend-${{ matrix.check }}
      - name: Save Go modules from one matrix job
        if: matrix.check == 'static' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Upload backend coverage
        if: always() && matrix.check == 'coverage'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage
          path: coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Run frontend checks
        run: make ci-frontend

  smoke:
    name: Smoke
    needs: plan
    if: needs.plan.outputs.production == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Cache production image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rainy-buildx-cache
          key: docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', '.dockerignore', 'docker/**', 'VERSION', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', 'web/**') }}
          restore-keys: docker-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production image
        run: >-
          make DOCKER_IMAGE=rainy:ci DOCKER_BUILD="docker buildx build"
          DOCKER_BUILD_ARGS="--load --cache-from type=local,src=$RUNNER_TEMP/rainy-buildx-cache --cache-to type=local,dest=$RUNNER_TEMP/rainy-buildx-cache-next,mode=max"
          docker-build
      - name: Replace exported layer cache
        run: |
          rm -rf -- "$RUNNER_TEMP/rainy-buildx-cache"
          mv -- "$RUNNER_TEMP/rainy-buildx-cache-next" "$RUNNER_TEMP/rainy-buildx-cache"
      - name: Exercise the production image
        run: make DOCKER_IMAGE=rainy:ci smoke

  # The advisory audits run only for a pull request that changes the matching
  # manifest; the daily Dependency audit workflow covers main.
  go-audit:
    name: Go audit
    needs: plan
    if: needs.plan.outputs.go_audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Check reachable vulnerabilities in modules and the standard library
        run: make backend-vuln

  web-audit:
    name: Web audit
    needs: plan
    if: needs.plan.outputs.web_audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Audit the production dependencies
        run: make frontend-audit

  # The only result a caller or a ruleset needs: it fails unless Plan, Policy,
  # and every planned job succeeded, and only the plan may authorize a skip.
  gate:
    name: Gate
    if: always()
    needs: [plan, policy, style, backend, frontend, smoke, go-audit, web-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Verify all planned validation results
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: make ci-results
