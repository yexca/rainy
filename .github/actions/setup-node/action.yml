name: Set up Node
description: Install the Node version pinned by the repository and enable pnpm.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: Enable pnpm
      shell: bash
      run: corepack enable
