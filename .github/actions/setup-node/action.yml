name: Set up Node
description: Install the Node version pinned by the repository and enable pnpm.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: Enable pnpm
      shell: bash
      run: corepack enable
